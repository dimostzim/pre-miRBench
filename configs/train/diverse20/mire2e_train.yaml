# miRe2e retraining configuration.
# Generated by benchmark/train_data/build_dataset.py from the shared canonical
# windows. miRe2e inputs are center-cropped to length before training.
positive_fasta: data/train/diverse20/tool_inputs/mire2e/positive.fa
negative_fasta: data/train/diverse20/tool_inputs/mire2e/negative.fa
validation_positive_fasta: data/train/diverse20/tool_inputs/mire2e/validation_positive.fa
validation_negative_fasta: data/train/diverse20/tool_inputs/mire2e/validation_negative.fa

device: cuda
pretrained: hsa
train_structure: true
train_mfe: true
structure_training_fasta: null
mfe_training_fasta: null
length: 100
batch_size: 32
structure_batch_size: 32
mfe_batch_size: 32
epochs: 600
structure_epochs: 600
mfe_epochs: 600
seed: 42

# Optional inference input for the generated inference_config.yaml.
inference_input: null
step: 20
inference_batch_size: 4096
