# MuStARD retraining configuration.
# MuStARD trains from intervals plus genome inputs, not FASTA.
positiveIntervals: data/train/diverse20/tool_inputs/mustard/positive.bed
negativeIntervals: data/train/diverse20/tool_inputs/mustard/negative.bed
testPositiveIntervals: null
testNegativeIntervals: null
validationPositiveIntervals: data/train/diverse20/tool_inputs/mustard/validation_positive.bed
validationNegativeIntervals: data/train/diverse20/tool_inputs/mustard/validation_negative.bed
genome: data/train/diverse20/genome.fa
consDir: data/train/diverse20

# Positive intervals are first and assigned class 0 so class_0 remains the
# positive class in downstream normalization.
classList: 0,1
classNum: 2
device: cuda
maxSize: 200
extFlag: 0
reinfNum: 5
shufClassFlag: 0
inputMode: sequence,RNAfold
modelType: CNN
threads: 10
# Used only when explicit test/validation interval files are not provided.
excludedTestChroms: chr1,chr3
excludedValidChroms: chr2,chr4

chromList: all
winSize: 200
step: 5
staticPredFlag: 1
modelDirName: results
intermDir: results/mustard_intermediate
inference_input: null
