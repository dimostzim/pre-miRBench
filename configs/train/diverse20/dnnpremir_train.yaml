# dnnPreMiR retraining configuration.
# The wrapper folds FASTA inputs with RNAfold and generates the seq_struc CSVs
# expected by upstream dnnPreMiR. Inputs are center-cropped to 180 nt by
# benchmark/train_data/build_dataset.py.
positive_fasta: data/train/diverse20/tool_inputs/dnnpremir/positive.fa
negative_fasta: data/train/diverse20/tool_inputs/dnnpremir/negative.fa
validation_positive_fasta: data/train/diverse20/tool_inputs/dnnpremir/validation_positive.fa
validation_negative_fasta: data/train/diverse20/tool_inputs/dnnpremir/validation_negative.fa

# Optional: use precomputed CSVs instead of FASTA. Each CSV must contain a
# seq_struc column using dnnPreMiR tokens, e.g. "A. U( G(".
positive_csv: null
negative_csv: null

device: cuda
architecture: cnn
batch_size: 200
epochs: 600
validation_split: 0.2
early_stopping_patience: 20
early_stopping_monitor: val_auprc
seed: 42

# dnnPreMiR inference consumes FASTA, so set this to the file you want the
# generated inference config to score.
inference_fasta: data/smoke/tool_smoke_test.fa
