# deepMiRGene retraining configuration.
# Generated by benchmark/train_data/build_dataset.py from the shared canonical
# windows. deepMiRGene consumes the full canonical sequence view.
positive_fasta: data/train/diverse20/tool_inputs/deepmirgene/positive.fa
negative_fasta: data/train/diverse20/tool_inputs/deepmirgene/negative.fa
validation_positive_fasta: data/train/diverse20/tool_inputs/deepmirgene/validation_positive.fa
validation_negative_fasta: data/train/diverse20/tool_inputs/deepmirgene/validation_negative.fa

device: cuda
batch_size: 256
epochs: 600
validation_split: 0.2
early_stopping_patience: 20
early_stopping_monitor: val_auprc
seed: 1337

inference_input: null
