# MuStARD retraining configuration.
# MuStARD trains from intervals plus genome/conservation inputs, not FASTA.
positiveIntervals: data/train/mustard_positive.bed
negativeIntervals: data/train/mustard_negative.bed
genome: benchmark/data/chr14.fa
consDir: benchmark/data

# Positive intervals are first and assigned class 0 so class_0 remains the
# positive class in downstream normalization.
classList: 0,1
classNum: 2
maxSize: 200
extFlag: 0
reinfNum: 5
shufClassFlag: 0
inputMode: sequence,RNAfold,conservation
modelType: CNN
threads: 10
excludedTestChroms: chr1,chr3
excludedValidChroms: chr2,chr4

chromList: all
winSize: 200
step: 5
staticPredFlag: 1
modelDirName: results
intermDir: results/mustard_intermediate
inference_input: null
