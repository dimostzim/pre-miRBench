# miRe2e Configuration
# Default smoke input committed with the repository.

# Required parameters
input: benchmark/data/tool_smoke_test.fa

# Optional parameters (defaults shown)
device: cuda          # default: cpu
pretrained: hsa       # default: hsa
length: 100           # keep pretrained-compatible window size; changing this can break model geometry
step: 20              # keep pretrained-compatible scan stride for the bundled model
batch_size: 4096      # default: 4096
