[project]
name = "premirbench-model"
version = "1.0.0"
description = "Training, inference, and evaluation for the pre-miRBench reference model"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.5.1",
  "pandas==2.3.1",
  "scikit-learn==1.7.1",
  "torch==2.9.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
